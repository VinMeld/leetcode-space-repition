# Development compose - starts only the database for local development
services:
  db:
    image: postgres:16-alpine
    container_name: leetcode-sr-db-dev
    environment:
      POSTGRES_USER: leetcode
      POSTGRES_PASSWORD: leetcode_dev
      POSTGRES_DB: leetcode_sr
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U leetcode -d leetcode_sr" ]
      interval: 5s
      timeout: 5s
      retries: 5
