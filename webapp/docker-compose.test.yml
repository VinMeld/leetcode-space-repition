services:
  # Test database - isolated from dev
  db-test:
    image: postgres:16-alpine
    container_name: leetcode-sr-db-test
    environment:
      POSTGRES_USER: leetcode_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: leetcode_sr_test
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U leetcode_test -d leetcode_sr_test" ]
      interval: 2s
      timeout: 2s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data # Use tmpfs for faster tests
