name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Release CLI with GoReleaser
  goreleaser:
    name: Release CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

  # Build and push Docker image for webapp
  docker:
    name: Docker Webapp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/leetcode-sr:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/leetcode-sr:${{ steps.version.outputs.VERSION }}

  # Update Homebrew tap
  homebrew-update:
    name: Update Homebrew
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Note
        run: |
          echo "Homebrew tap updated automatically via GoReleaser brew section"
          echo "Version: ${{ steps.version.outputs.version }}"
