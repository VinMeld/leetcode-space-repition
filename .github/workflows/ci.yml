name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Test and lint Go CLI
  cli:
    name: CLI - Test and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v -coverprofile=coverage.out $(go list ./... | grep -v cmd)

      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "Coverage is below 60%"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: cli

      - name: Run govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build CLI
        run: go build -v -o leetcode-sr ./cmd/leetcode-sr

  # Test and build webapp
  webapp:
    name: Webapp - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Start Test Database
        run: npm run db:test:start

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  # Validate extension manifest
  extension:
    name: Extension - Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          if ! python3 -c "import json; json.load(open('extension/manifest.json'))"; then
            echo "Invalid manifest.json"
            exit 1
          fi
          echo "manifest.json is valid JSON"

  # Extension unit tests
  extension-test:
    name: Extension - Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  # Extension E2E tests
  extension-e2e:
    name: Extension - E2E Tests
    runs-on: ubuntu-latest
    needs: [webapp] # Webapp must build first
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Install Playwright browsers
        working-directory: extension
        run: npx playwright install --with-deps chromium

      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci

      - name: Start Test Database
        working-directory: webapp
        run: npm run db:test:start

      - name: Run E2E tests
        working-directory: extension
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://leetcode_test:test_password@localhost:5433/leetcode_sr_test
