<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode SR Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            padding: 16px;
        }

        h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 span {
            color: #58a6ff;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 8px 12px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 13px;
        }

        input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        input::placeholder {
            color: #6e7681;
        }

        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #58a6ff 0%, #388bfd 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            display: none;
        }

        .status.success {
            display: block;
            background: rgba(63, 185, 80, 0.15);
            border: 1px solid rgba(63, 185, 80, 0.3);
            color: #3fb950;
        }

        .status.error {
            display: block;
            background: rgba(248, 81, 73, 0.15);
            border: 1px solid rgba(248, 81, 73, 0.3);
            color: #f85149;
        }

        .shortcuts {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #30363d;
        }

        .shortcuts h2 {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 8px;
        }

        .shortcut-list {
            font-size: 11px;
            color: #6e7681;
        }

        .shortcut-list div {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .shortcut-list kbd {
            background: #21262d;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #e6edf3;
        }

        .footer {
            margin-top: 12px;
            font-size: 10px;
            color: #6e7681;
            text-align: center;
        }

        .footer a {
            color: #58a6ff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h1>🧠 <span>LeetCode SR</span></h1>

    <div class="form-group">
        <label for="apiUrl">API URL</label>
        <input type="url" id="apiUrl" placeholder="http://localhost:3001/api">
    </div>

    <div class="form-group">
        <label for="webappUrl">Webapp URL (for login)</label>
        <input type="url" id="webappUrl" placeholder="http://localhost:5173">
    </div>

    <!-- Login/Logout Section -->
    <div id="authSection">
        <button id="loginBtn">Log In with Webapp</button>
        <div id="loggedInState" style="display: none;">
            <p style="font-size: 13px; color: #3fb950; margin-bottom: 8px;">✓ Logged In</p>
            <button id="logoutBtn" style="background: #21262d; border: 1px solid #30363d;">Log Out</button>
        </div>
    </div>

    <button id="saveBtn" style="margin-top: 12px; background: #21262d;">Save URL</button>
    <button id="testBtn" style="margin-top: 8px; background: #21262d;">Test Connection</button>

    <div id="status" class="status"></div>

    <div class="shortcuts">
        <h2>Keyboard Shortcuts</h2>
        <div class="shortcut-list">
            <div><span>Add problem</span><kbd>Alt+1</kbd></div>
            <div><span>Rate 0 (blackout)</span><kbd>Alt+2</kbd></div>
            <div><span>Rate 3 (hard)</span><kbd>Alt+3</kbd></div>
            <div><span>Rate 4 (good)</span><kbd>Alt+4</kbd></div>
            <div><span>Rate 5 (perfect)</span><kbd>Alt+5</kbd></div>
        </div>
    </div>

    <div class="footer">
        <a href="#" id="customizeLink">Customize shortcuts</a>
    </div>

    <script src="popup.js"></script>
</body>

</html>
