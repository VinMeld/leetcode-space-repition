linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - bodyclose
    - noctx
    - gosec
    - prealloc
    - revive

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
  gosec:
    excludes:
      - G104  # Unhandled errors (we handle them appropriately)
  misspell:
    locale: US

run:
  timeout: 5m
  tests: true
  
issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
