version: 2

project_name: leetcode-sr

before:
  hooks:
    - go mod tidy

builds:
  - id: leetcode-sr
    main: ./cmd/leetcode-sr
    binary: leetcode-sr
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

nfpms:
  - id: leetcode-sr-pkg
    package_name: leetcode-sr
    builds:
      - leetcode-sr
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: VinMeld
    homepage: https://github.com/VinMeld/leetcode-space-repition
    maintainer: Vinay <vinaymeldrum@gmail.com>
    description: CLI for LeetCode Spaced Repetition Tracker
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

aurs:
  - name: leetcode-sr-bin
    homepage: https://github.com/VinMeld/leetcode-space-repition
    description: CLI for LeetCode Spaced Repetition Tracker (Binary)
    maintainers:
      - "Vinay <vinaymeldrum@gmail.com>"
    license: "MIT"
    private_key: '{{ .Env.AUR_SSH_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/leetcode-sr-bin.git'
    conflicts:
      - leetcode-sr
      - leetcode-sr-git
    provides:
      - leetcode-sr
    package: |-
      # bin
      install -Dm755 "./leetcode-sr" "${pkgdir}/usr/bin/leetcode-sr"

# Homebrew tap (requires HOMEBREW_TAP_TOKEN secret)
brews:
  - name: leetcode-sr
    repository:
      owner: VinMeld
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/VinMeld/leetcode-space-repition"
    description: "CLI for LeetCode Spaced Repetition Tracker"
    license: "MIT"
    install: |
      bin.install "leetcode-sr"
    test: |
      system "#{bin}/leetcode-sr", "--version"
